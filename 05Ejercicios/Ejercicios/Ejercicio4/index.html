<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ejercicio 4 – Calificación final</title>
  <link rel="stylesheet" href="../../css/ejercicios.css"/>
</head>
<body>
<header class="header-minimal">
  <h1>Ejercicio 4 · Calificación final</h1>
  <div class="header-right"><p>Vega Sandoval Julio Emiliano</p></div>
</header>

<main>
  <section class="form-card">
    <h2>Ponderación: 55% parciales, 30% examen, 15% trabajo</h2>
    <form id="form-e4" class="grid-2" novalidate>
      <div><label for="p1">Parcial 1 (0–10)</label><input id="p1" type="number" min="0" max="10" step="0.01" required/></div>
      <div><label for="p2">Parcial 2 (0–10)</label><input id="p2" type="number" min="0" max="10" step="0.01" required/></div>
      <div><label for="p3">Parcial 3 (0–10)</label><input id="p3" type="number" min="0" max="10" step="0.01" required/></div>
      <div><label for="ex">Examen final (0–10)</label><input id="ex" type="number" min="0" max="10" step="0.01" required/></div>
      <div><label for="tf">Trabajo final (0–10)</label><input id="tf" type="number" min="0" max="10" step="0.01" required/></div>

      <div class="actions" style="grid-column:1/-1">
        <button type="button" class="btn btn-primary" id="calc">Calcular</button>
        <button type="reset" class="btn btn-ghost">Borrar</button>
      </div>
      <div id="err" class="error" style="grid-column:1/-1"></div>
      <div id="out" class="result" style="grid-column:1/-1; display:none"></div>
    </form>
  </section>
</main>

<footer>
  <p>© 2025 - Ejercicio4 de Julio Emiliano</p>
  <button onclick="window.location.href='../../ejercicio1.html'">Volver al menú</button>
</footer>

<script src="./e4.js" defer></script>
</body>
</html>
