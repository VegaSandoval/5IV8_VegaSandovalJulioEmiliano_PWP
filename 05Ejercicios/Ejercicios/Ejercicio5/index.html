<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ejercicio 5 – Porcentajes</title>
  <link rel="stylesheet" href="../../css/ejercicios.css"/>
</head>
<body>
<header class="header-minimal">
  <h1>Ejercicio 5 · Porcentaje H/M</h1>
  <div class="header-right"><p>Vega Sandoval Julio Emiliano</p></div>
</header>

<main>
  <section class="form-card">
    <h2>Distribución por género en el grupo</h2>
    <form id="form-e5" class="grid-2" novalidate>
      <div><label for="h">Hombres</label><input id="h" type="number" min="0" step="1" required/></div>
      <div><label for="m">Mujeres</label><input id="m" type="number" min="0" step="1" required/></div>

      <div class="actions" style="grid-column:1/-1">
        <button type="button" class="btn btn-primary" id="calc">Calcular</button>
        <button type="reset" class="btn btn-ghost">Borrar</button>
      </div>
      <div id="err" class="error" style="grid-column:1/-1"></div>
      <div id="out" class="result" style="grid-column:1/-1; display:none"></div>
    </form>
  </section>
</main>

<footer>
  <p>© 2025 - Ejercicio5 de Julio Emiliano</p>
  <button onclick="window.location.href='../../ejercicio1.html'">Volver al menú</button>
</footer>

<script src="./e5.js" defer></script>
</body>
</html>
