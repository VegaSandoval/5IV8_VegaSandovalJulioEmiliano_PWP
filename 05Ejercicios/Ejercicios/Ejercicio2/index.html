<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ejercicio 2 – Comisiones</title>
  <link rel="stylesheet" href="../../css/ejercicios.css"/>
</head>
<body>
<header class="header-minimal">
  <h1>Ejercicio 2 · Sueldo con comisiones</h1>
  <div class="header-right"><p>Vega Sandoval Julio Emiliano</p></div>
</header>

<main>
  <section class="form-card">
    <h2>10% de comisión sobre tres ventas</h2>
    <form id="form-e2" class="grid-2" novalidate>
      <div><label for="base">Sueldo base ($)</label><input id="base" type="number" min="0" step="0.01" required/></div>
      <div><label for="v1">Venta 1 ($)</label><input id="v1" type="number" min="0" step="0.01" required/></div>
      <div><label for="v2">Venta 2 ($)</label><input id="v2" type="number" min="0" step="0.01" required/></div>
      <div><label for="v3">Venta 3 ($)</label><input id="v3" type="number" min="0" step="0.01" required/></div>

      <div class="actions" style="grid-column:1/-1">
        <button type="button" class="btn btn-primary" id="calc">Calcular</button>
        <button type="reset" class="btn btn-ghost">Borrar</button>
      </div>
      <div id="err" class="error" style="grid-column:1/-1"></div>
      <div id="out" class="result" style="grid-column:1/-1; display:none"></div>
    </form>
  </section>
</main>

<footer>
  <p>© 2025 - Ejercicio2 de Julio Emiliano</p>
  <button onclick="window.location.href='../../ejercicio1.html'">Volver al menú</button>
</footer>

<script src="./e2.js" defer></script>
</body>
</html>
